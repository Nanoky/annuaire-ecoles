spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: annuaire

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
scalar:
  path: /docs